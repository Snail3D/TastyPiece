; TastyPiece — ESP32 mesh companion + captive-portal web client
; https://github.com/Snail3D/TastyPiece  (planned)
;
; Board target: ESP32-C3 SuperMini with 0.42" SSD1306 OLED (72x40)
; Also supports Heltec WiFi LoRa 32 V3 (ESP32-S3) — see [env:heltec-v3]

[platformio]
default_envs = esp32c3-supermini

[env]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
  -Wall
  -DTYPEPIECE
lib_deps =
  olikraus/U8g2 @ ^2.35.30
  bblanchon/ArduinoJson @ ^7.2.1
  h2zero/NimBLE-Arduino @ ^1.4.1

[env:esp32c3-supermini]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
upload_speed = 460800
build_flags =
  ${env.build_flags}
  -DBOARD_ESP32C3_SUPERMINI=1
  -DTP_OLED_SSD1306_72X40=1
  -DTP_HAS_WIFI=1
  -DTP_HAS_BLE=1
  -DTP_HAS_PSRAM=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Diagnostic build: Wi-Fi AP only, no BLE radio (isolates coexistence issues)
[env:esp32c3-nobt]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
upload_speed = 460800
build_flags =
  ${env.build_flags}
  -DBOARD_ESP32C3_SUPERMINI=1
  -DTP_OLED_SSD1306_72X40=1
  -DTP_HAS_WIFI=1
  -DTP_DISABLE_BLE=1
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_speed = 460800
build_flags =
  ${env.build_flags}
  -DBOARD_ESP32DEV=1
  -DTP_OLED_SSD1306=1
  -DTP_HAS_WIFI=1
  -DTP_HAS_BLE=1
  -DTP_HAS_PSRAM=0

[env:heltec-v3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
upload_speed = 460800
build_flags =
  ${env.build_flags}
  -DBOARD_HELTEC_V3=1
  -DTP_OLED_SSD1306=1
  -DTP_HAS_WIFI=1
  -DTP_HAS_BLE=1
  -DTP_HAS_PSRAM=1
